<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>DocTra Admin</title>
    <meta name="theme-color" content="#0f5fd7" />
    <link rel="icon" type="image/png" href="%BASE_URL%shared/assets/doctra-icon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%shared/assets/doctra-icon.png" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f3f7ff;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        color: #10203a;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.78), transparent 42%),
          linear-gradient(180deg, #f8fbff 0%, #e8f0ff 100%);
        transition:
          opacity 480ms ease,
          visibility 480ms ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .appSplash-shell {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .appSplash-mark {
        position: relative;
        display: grid;
        width: 112px;
        height: 112px;
        place-items: center;
      }

      .appSplash-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: conic-gradient(
          from 0deg,
          #0f5fd7,
          #14b8a6,
          #f59e0b,
          #0f5fd7
        );
        animation: appSplashSpin 1100ms linear infinite;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 3px;
      }

      .appSplash-logoFrame {
        display: grid;
        width: 86px;
        height: 86px;
        place-items: center;
        border: 1px solid rgba(15, 95, 215, 0.12);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 18px 36px rgba(15, 23, 42, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.96);
        animation: appSplashLift 1800ms ease-in-out infinite;
      }

      .appSplash-logo {
        width: 58px;
        height: 58px;
        object-fit: contain;
        animation: appSplashLogo 900ms ease both;
      }

      .appSplash-title {
        margin: 0;
        color: #10203a;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, sans-serif;
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }

      .appSplash-progress {
        position: relative;
        width: min(208px, 62vw);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(15, 95, 215, 0.14);
      }

      .appSplash-progress::before {
        content: "";
        position: absolute;
        inset: 0;
        transform-origin: left center;
        border-radius: inherit;
        background: linear-gradient(90deg, #0f5fd7, #14b8a6, #f59e0b);
        animation: appSplashProgress 2300ms cubic-bezier(0.65, 0, 0.35, 1)
          infinite;
      }

      @keyframes appSplashSpin {
        to {
          transform: rotate(1turn);
        }
      }

      @keyframes appSplashLift {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes appSplashLogo {
        from {
          opacity: 0;
          transform: scale(0.82);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes appSplashProgress {
        0% {
          transform: translateX(-100%) scaleX(0.5);
        }

        45% {
          transform: translateX(0) scaleX(0.72);
        }

        100% {
          transform: translateX(100%) scaleX(0.35);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        .appSplash-mark::before,
        .appSplash-logoFrame,
        .appSplash-logo,
        .appSplash-progress::before {
          animation: none;
          transition: none;
        }

        .appSplash-progress::before {
          transform: none;
        }
      }
    </style>
    <script>
      window.__APP_SPLASH_STARTED_AT = performance.now();
    </script>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="DocTra Admin loading">
      <div class="appSplash-shell">
        <div class="appSplash-mark" aria-hidden="true">
          <div class="appSplash-logoFrame">
            <img
              class="appSplash-logo"
              src="%BASE_URL%shared/assets/doctra-icon.png"
              alt=""
            />
          </div>
        </div>
        <p class="appSplash-title">DocTra Admin</p>
        <div class="appSplash-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="react-root"></div>
    <script type="module" src="/src/react-app/main.jsx"></script>
  </body>
</html>
