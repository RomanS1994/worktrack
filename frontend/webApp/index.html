<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>WorkTrack</title>
    <meta name="description" content="WorkTrack employee time tracking." />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/shared/assets/worktrack-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/shared/assets/worktrack-icon-180.png" />
    <link rel="stylesheet" href="/src/react-app/pages/CalendarPage/CalendarDayHours.css" />
    <link rel="stylesheet" href="/push-settings.css" />
    <style>
      html, body { min-height: 100%; margin: 0; background: #f7faf8; }
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483647; display: grid;
        min-height: 100svh; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #102018;
        background: linear-gradient(135deg, rgba(255,255,255,.82), transparent 42%), linear-gradient(180deg, #fbfefc 0%, #eaf7ee 100%);
        transition: opacity 480ms ease, visibility 480ms ease;
      }
      #app-splash.is-hiding { opacity: 0; visibility: hidden; pointer-events: none; }
      .appSplash-shell { display: grid; justify-items: center; gap: 18px; }
      .appSplash-mark { position: relative; display: grid; width: 112px; height: 112px; place-items: center; }
      .appSplash-mark::before {
        content: ""; position: absolute; inset: 0; border-radius: 28px;
        background: conic-gradient(from 0deg, #16a34a, #22c55e, #86efac, #16a34a);
        animation: appSplashSpin 1100ms linear infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; padding: 3px;
      }
      .appSplash-logoFrame {
        display: grid; width: 86px; height: 86px; place-items: center;
        border: 1px solid rgba(22,163,74,.12); border-radius: 24px;
        background: rgba(255,255,255,.94);
        box-shadow: 0 18px 36px rgba(15,23,42,.10), inset 0 1px 0 rgba(255,255,255,.96);
        animation: appSplashLift 1800ms ease-in-out infinite;
      }
      .appSplash-logo { width: 66px; height: 66px; object-fit: contain; animation: appSplashLogo 900ms ease both; }
      .appSplash-title {
        margin: 0; color: #102018;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: 0;
      }
      .appSplash-progress { position: relative; width: min(208px,62vw); height: 4px; overflow: hidden; border-radius: 999px; background: rgba(22,163,74,.14); }
      .appSplash-progress::before {
        content: ""; position: absolute; inset: 0; transform-origin: left center; border-radius: inherit;
        background: linear-gradient(90deg, #15803d, #22c55e, #86efac);
        animation: appSplashProgress 2300ms cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes appSplashSpin { to { transform: rotate(1turn); } }
      @keyframes appSplashLift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes appSplashLogo { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
      @keyframes appSplashProgress { 0% { transform: translateX(-100%) scaleX(.5); } 45% { transform: translateX(0) scaleX(.72); } 100% { transform: translateX(100%) scaleX(.35); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash, .appSplash-mark::before, .appSplash-logoFrame, .appSplash-logo, .appSplash-progress::before { animation: none; transition: none; }
        .appSplash-progress::before { transform: none; }
      }
    </style>
    <script>window.__APP_SPLASH_STARTED_AT = performance.now();</script>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="WorkTrack loading">
      <div class="appSplash-shell">
        <div class="appSplash-mark" aria-hidden="true">
          <div class="appSplash-logoFrame">
            <img class="appSplash-logo" src="%BASE_URL%shared/assets/worktrack-icon.svg" alt="" />
          </div>
        </div>
        <p class="appSplash-title">WorkTrack</p>
        <div class="appSplash-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="react-root"></div>
    <script type="module" src="/src/react-app/main.jsx"></script>
  </body>
</html>
