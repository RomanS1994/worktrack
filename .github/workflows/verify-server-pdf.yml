name: Verify server PDF

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-server-pdf.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install backend dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Generate real invoice PDF buffer
        run: |
          node --input-type=module <<'NODE'
          import { generateInvoicePdfBuffer } from './backend/services/invoice-pdf.js';
          const invoice = {
            invoiceNumber: 'WT-2026-TEST', status: 'DRAFT', currency: 'CZK',
            issueDate: '2026-08-30', dueDate: '2026-09-13',
            periodStart: '2026-08-01', periodEnd: '2026-08-31',
            hourlyRate: '350.00', totalHours: '8.00', subtotal: '2800.00',
            variableSymbol: '2026000001',
            paymentDescriptor: 'SPD*1.0*ACC:CZ6508000000192000145399*AM:2800.00*CC:CZK*X-VS:2026000001*MSG:Faktura*',
            seller: { businessName: 'Roman Stryzhka', address: 'Praha', ico: '12345678', iban: 'CZ6508000000192000145399' },
            buyer: { name: 'Global Group', address: 'Praha', ico: '87654321' },
            items: [{ id: '1', workDate: '2026-08-01', description: 'Projekt — montáž', hours: '8.00', hourlyRate: '350.00', amount: '2800.00' }],
          };
          const buffer = await generateInvoicePdfBuffer(invoice);
          if (!Buffer.isBuffer(buffer) || buffer.length < 1000 || buffer.subarray(0, 4).toString() !== '%PDF') {
            throw new Error(`Invalid PDF buffer: ${buffer?.length || 0}`);
          }
          console.log(`PDF generated: ${buffer.length} bytes`);
          NODE
      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://worktrack-api-jc5m.onrender.com/api
        run: npm run build:web
