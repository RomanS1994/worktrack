name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional Render commit SHA to require
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      BACKEND_URL: https://worktrack-api-jc5m.onrender.com
      FRONTEND_URL: https://worktrackings.netlify.app
      EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.expected_commit || '' }}
      SMOKE_ATTEMPTS: ${{ github.event_name == 'push' && '20' || '4' }}
      SMOKE_DELAY_MS: '30000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Run deploy-aware read-only production smoke
        run: node tools/production-smoke.js
