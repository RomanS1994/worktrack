name: Sync PDF locks

on:
  push:
    branches: [main]
    paths:
      - package.json
      - backend/package.json
      - .github/workflows/sync-pdf-locks.yml

permissions:
  contents: write

jobs:
  sync-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Sync root lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Sync backend lock
        run: npm --prefix backend install --package-lock-only --ignore-scripts
      - name: Commit locks
        run: |
          if git diff --quiet package-lock.json backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          git commit -m "Sync server PDF dependency locks"
          git push
