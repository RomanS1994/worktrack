name: Temporary rejection reason patch

on:
  push:
    branches:
      - agent/rejection-reason

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rejection-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch worktrack service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/worktrack.js')
          text = path.read_text()

          replacements = [
              (
                  "    reviewedAt: toIsoTimestamp(submission.reviewedAt),\n    createdAt: toIsoTimestamp(submission.createdAt),",
                  "    reviewedAt: toIsoTimestamp(submission.reviewedAt),\n    rejectionReason: normalizeText(submission.rejectionReason),\n    createdAt: toIsoTimestamp(submission.createdAt),",
              ),
              (
                  "          reviewedByMembershipId: null,\n          weekEnd: range.weekEnd,",
                  "          reviewedByMembershipId: null,\n          rejectionReason: null,\n          weekEnd: range.weekEnd,",
              ),
              (
                  "          reviewedAt: null,\n          createdAt: timestamp,",
                  "          reviewedAt: null,\n          rejectionReason: null,\n          createdAt: timestamp,",
              ),
              (
                  "export async function reviewWeeklySubmission(client, context, submissionId, decision) {\n  const managerMembership = ensureManagerContext(context);\n  const nextStatus = decision === 'approve' ? 'APPROVED' : 'REJECTED';",
                  "export async function reviewWeeklySubmission(\n  client,\n  context,\n  submissionId,\n  decision,\n  payload = {}\n) {\n  const managerMembership = ensureManagerContext(context);\n  const nextStatus = decision === 'approve' ? 'APPROVED' : 'REJECTED';\n  const rejectionReason =\n    nextStatus === 'REJECTED' ? normalizeText(payload.rejectionReason).slice(0, 500) : '';",
              ),
              (
                  "      reviewedByMembershipId: managerMembership.id,\n      reviewedAt: timestamp,\n      updatedAt: timestamp,",
                  "      reviewedByMembershipId: managerMembership.id,\n      reviewedAt: timestamp,\n      rejectionReason: nextStatus === 'REJECTED' ? rejectionReason || null : null,\n      updatedAt: timestamp,",
              ),
              (
                  "      status: nextStatus,\n      reviewedByMembershipId: managerMembership.id,\n    },",
                  "      status: nextStatus,\n      reviewedByMembershipId: managerMembership.id,\n      rejectionReason: nextStatus === 'REJECTED' ? rejectionReason : '',\n    },",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/services/worktrack.js
          git commit -m "wire rejection reason through worktrack service"
          git push origin HEAD:agent/rejection-reason
