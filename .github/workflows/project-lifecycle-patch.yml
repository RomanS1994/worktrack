name: Project Lifecycle Patch

on:
  push:
    branches:
      - agent/project-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'test project reactivation lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-lifecycle

      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path('backend/tests/worktrack-foundation.test.js')
          text = tests.read_text()
          old = """  submitEmployeeWeek,\n  updateEmployeeMembership,\n  updateEmployeeWorkEntry,\n"""
          new = """  submitEmployeeWeek,\n  updateEmployeeMembership,\n  updateEmployeeWorkEntry,\n  updateProject,\n"""
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          anchor = """test('employee cannot create WorkEntry for another company project', async () => {\n"""
          case = """test('manager can reactivate an inactive project', async () => {\n  const seed = createSeed();\n  const inactiveProject = { ...seed.projectA, isActive: false };\n  const client = createFakeWorkTrackClient({\n    users: [seed.managerA],\n    companies: [seed.companyA],\n    memberships: [seed.managerMembershipA],\n    projects: [inactiveProject],\n  });\n  const managerContext = context(seed.managerA, seed.managerMembershipA);\n\n  const before = await listProjects(client, managerContext);\n  assert.equal(before.projects[0].isActive, false);\n\n  const updated = await updateProject(client, managerContext, inactiveProject.id, {\n    isActive: true,\n  });\n  assert.equal(updated.isActive, true);\n\n  const after = await listProjects(client, managerContext);\n  assert.equal(after.projects[0].isActive, true);\n});\n\n"""
          if anchor not in text:
              raise SystemExit('test anchor not found')
          tests.write_text(text.replace(anchor, case + anchor, 1))
          PY

      - name: Commit regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/worktrack-foundation.test.js
          git commit -m "test project reactivation lifecycle"
          git push origin HEAD:agent/project-lifecycle
