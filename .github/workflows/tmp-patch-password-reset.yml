name: Temporary employee password reset patch

on:
  push:
    branches:
      - agent/employee-password-reset-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/employee-password-reset-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch worktrack service once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/worktrack.js')
          text = path.read_text()
          function_marker = 'export async function resetEmployeePassword('
          if function_marker in text:
              print('Password reset service already present; nothing to patch.')
              raise SystemExit(0)

          marker = "export async function listManagerSubmissions(client, context, query = {}) {"
          if text.count(marker) != 1:
              raise SystemExit('Expected listManagerSubmissions marker exactly once')

          addition = r'''export async function resetEmployeePassword(
  client,
  context,
  employeeMembershipId,
  payload = {}
) {
  const managerMembership = ensureManagerContext(context);
  const temporaryPassword = String(payload.temporaryPassword || payload.password || '');

  if (temporaryPassword.length < 8) {
    throw new Error('Password must be at least 8 characters long');
  }

  const employeeMembership = await client.companyMembership.findFirst({
    where: {
      id: employeeMembershipId,
      companyId: managerMembership.companyId,
      role: 'EMPLOYEE',
      user: {
        is: {
          deletedAt: null,
        },
      },
    },
    include: {
      user: true,
    },
  });

  if (!employeeMembership?.user) {
    throw new Error('Employee not found');
  }

  const timestamp = new Date(nowIso());

  await client.user.update({
    where: {
      id: employeeMembership.userId,
    },
    data: {
      passwordHash: hashPassword(temporaryPassword),
      mustChangePassword: true,
      updatedAt: timestamp,
    },
  });

  await client.session.deleteMany({
    where: {
      userId: employeeMembership.userId,
    },
  });

  await createAuditLog(client, {
    action: 'employee.password.reset',
    actorUserId: managerMembership.userId,
    targetUserId: employeeMembership.userId,
    entityType: 'company_membership',
    entityId: employeeMembership.id,
    after: {
      companyId: managerMembership.companyId,
      mustChangePassword: true,
      sessionsRevoked: true,
    },
  });

  return {
    ok: true,
    employeeId: employeeMembership.id,
  };
}

'''
          path.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/services/worktrack.js
          git commit -m "add manager employee password reset service"
          git push origin HEAD:agent/employee-password-reset-v2

