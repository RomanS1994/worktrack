name: Dependency Refresh

on:
  push:
    branches:
      - agent/e2e-deployment-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'refresh dependency locks'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/e2e-deployment-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh root dependency metadata
        run: |
          npm install --save-exact react-router-dom@7.18.2 --package-lock-only
          npm install --save-dev prisma@^6.19.3 --package-lock-only
          npm audit fix --package-lock-only

      - name: Refresh backend dependency metadata
        run: |
          npm --prefix backend install --save-dev prisma@^6.19.3 --package-lock-only
          npm --prefix backend audit fix --package-lock-only

      - name: Commit dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency metadata already up to date."
            exit 0
          fi
          git commit -m "refresh dependency locks"
          git push origin HEAD:agent/e2e-deployment-hardening
