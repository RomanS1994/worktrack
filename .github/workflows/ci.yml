name: CI

on:
  pull_request:
  push:
    branches:
      - refactor/frontend-stabilization
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
        run: npm --prefix backend run db:generate

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
        run: npm --prefix backend test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://worktrack-api-jc5m.onrender.com/api
        run: npm run build:web
