name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: worktrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worktrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_APP_URL: http://127.0.0.1:4173
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_USER_PASSWORD: WorkTrack-CI-User-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
        run: npm --prefix backend run db:generate

      - name: Run backend tests
        run: npm --prefix backend test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3000/api
        run: npm run build:web

      - name: Apply test database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
        run: npm --prefix backend run db:migrate:deploy

      - name: Seed dual-role browser scenario
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
        run: node e2e/seed.js

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local backend and frontend
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worktrack?schema=public
          AUTH_TOKEN_SECRET: worktrack-ci-auth-token-secret-2026-not-production
          CLIENT_ORIGIN: http://127.0.0.1:4173
        run: |
          npm --prefix backend start > /tmp/worktrack-backend.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/worktrack-frontend.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173 >/dev/null 2>&1 && break
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:4173 >/dev/null

      - name: Run dual-role browser E2E
        run: npx playwright test --config=e2e/playwright.config.js dual-role.spec.js --project=chromium --reporter=line

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/worktrack-backend.log
            /tmp/worktrack-frontend.log
          if-no-files-found: ignore
