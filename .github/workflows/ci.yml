name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://127.0.0.1:5432/worktrack?schema=public
      VITE_API_BASE_URL: http://127.0.0.1:3000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma client
        run: npm --prefix backend run db:generate

      - name: Run backend tests
        run: npm --prefix backend test

      - name: Build frontend
        run: npm run build:web

      - name: Audit production runtime dependencies
        run: node tools/audit-production.js

      - name: Scan tracked files for secrets
        run: npm run secrets:check
