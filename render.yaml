services:
  - type: web
    name: worktrack-backend
    runtime: node
    branch: main
    buildCommand: npm run db:generate && npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: TZ
        value: Europe/Prague
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
